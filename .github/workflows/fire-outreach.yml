name: Fire Outreach Cloud Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 playwright python-dotenv dnspython

      - name: Install Playwright Chromium dependencies
        run: python -m playwright install --with-deps chromium

      - name: Create .env
        run: |
          cat > .env <<EOF
          UCT_EMAIL=${{ secrets.UCT_EMAIL }}
          UCT_PASSWORD=${{ secrets.UCT_PASSWORD }}
          UCT_SMTP_HOST=smtp.gmail.com
          UCT_SMTP_PORT=587
          EOF

      - name: Run scraper and sender
        run: |
          python maps_scraper.py || true
          python daily_auto.py

      - name: Commit progress back to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git pull origin main --rebase --autostash || true
          git add master_companies.csv data/sent_emails.db attachments
          git commit -m "Update outreach progress from Actions" || echo "No changes to commit"
          git push
