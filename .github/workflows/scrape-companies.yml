name: Scrape SA Companies

on:
  schedule:
    - cron: '0 6 * * *'  # 08:00 SAST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright python-dotenv dnspython
          playwright install --with-deps chromium

      - name: Run Scraper
        run: python maps_scraper_sa.py

      - name: Commit new companies
        run: |
          git config user.name "GitHub Scraper"
          git config user.email "scraper@fireguard.bot"
          git add master_companies.csv
          git commit -m "Update scraped companies [skip ci]" || echo "No changes"
          git push
