name: Send Olarm Outreach Once

on:
  schedule:
    # 07:00 SAST on 16 October 2026 = 05:00 UTC
    - cron: '0 5 16 10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-olarm:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Create .env
        run: |
          cat > .env <<EOF
          UCT_EMAIL=${{ secrets.UCT_EMAIL }}
          UCT_PASSWORD=${{ secrets.UCT_PASSWORD }}
          UCT_SMTP_HOST=smtp.gmail.com
          UCT_SMTP_PORT=587
          EOF

      - name: Send Olarm outreach emails
        run: python send_olarm_outreach.py
